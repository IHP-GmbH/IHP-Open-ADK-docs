version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

  jobs:
    pre_build:
      # Regenerate every table and CLI transcript from the pinned sources under
      # src/. Nothing normative in this site is hand-typed.
      - python3 docs/scripts/gen_rule_tables.py
      - python3 docs/scripts/gen_adapter_table.py
      - python3 docs/scripts/gen_version_matrix.py
      - python3 docs/scripts/gen_cli_usage.py

# The documented sources are pinned submodules under src/. recursive: false
# because ADK-Tools carries its own submodule set (the toolchain lockfile),
# which this site never reads.
submodules:
  include:
    - src/IHP-Open-ADK
    - src/ADK-Tools
    - src/chiplet-spec
    - src/OpenIntM4TM2
    - src/IHP-Interconnect-IntM4TM2
    - src/chiplet-studio
    - src/gds2kicad
    - src/Chiplets-KiCad-Plugin
  recursive: false

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
